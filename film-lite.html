<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>备用播放 · OpenMenuBar</title>
  <link rel="stylesheet" href="refresh.css?v=16">
  <link rel="stylesheet" href="assets/homepage-layout.css?v=3">
  <script src="assets/film-lite.js?v=2" defer></script>
</head>
<body>
<main class="wrap lite-film">
  <a class="text-link" href="./#film">返回官网短片</a>
  <h1>备用播放</h1>
  <p>1080p · 60 帧。网络较慢时可选省流版。</p>
  <video id="lite-video" controls playsinline preload="none" poster="assets/wallpaper-poster.jpg?v=6a9117ad72" aria-label="OpenMenuBar 宣传片">
    <track kind="subtitles" src="assets/wallpaper.zh.vtt?v=1feee5fb19" srclang="zh" label="中文字幕">
  </video>
  <div class="lite-film-controls" hidden>
    <button class="button" id="lite-load" type="button">播放短片</button>
    <label class="film-resolution">画质 <select id="lite-quality"><option value="hd" selected>1080p · 60 帧</option><option value="light">480p · 省流</option></select></label>
  </div>
  <p class="lite-film-status" id="lite-status" role="status"></p>
  <noscript><a class="text-link" href="assets/openmenubar-wallpaper-480p.mp4?v=930f742497">打开 480p 视频</a></noscript>
</main>
</body>
</html>
